name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install
      - name: Prepare the web app folder
        run: |
          mkdir -p www/lib
          cp index.html www/index.html
          cp node_modules/jszip/dist/jszip.min.js www/lib/
          cp node_modules/pdfjs-dist/build/pdf.min.js www/lib/
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply custom icon and splash
        run: |
          if [ -f icon.png ] || [ -f splash.png ]; then
            mkdir -p assets
            [ -f icon.png ] && cp icon.png assets/icon-only.png && cp icon.png assets/icon-foreground.png
            [ -f splash.png ] && cp splash.png assets/splash.png && cp splash.png assets/splash-dark.png
            npm i -D @capacitor/assets@3
            npx capacitor-assets generate --android --iconBackgroundColor '#670a36' --iconBackgroundColorDark '#240513' --splashBackgroundColor '#670a36' --splashBackgroundColorDark '#240513'
          fi
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ri-da-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
