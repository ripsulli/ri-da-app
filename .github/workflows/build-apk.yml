name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install
      - name: Prepare the web app folder
        run: |
          mkdir -p www/lib
          cp index.html www/index.html
          cp node_modules/jszip/dist/jszip.min.js www/lib/
          cp node_modules/pdfjs-dist/build/pdf.min.js www/lib/
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply custom icon and splash
        run: |
          sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          if [ -f icon.png ]; then
            rm -rf $RES/mipmap-anydpi-v26
            for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              d=${pair%%:*}; s=${pair##*:}
              convert icon.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
              cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
            done
          fi
          if [ -f splash.png ]; then
            find $RES -name splash.png | while read f; do convert splash.png -resize 1200x1200 "$f"; done
          fi
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ri-da-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
